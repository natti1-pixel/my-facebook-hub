
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Facebook Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h1>My Facebook Hub</h1>
  <p>Welcome to your Facebook Mini App!</p>

  <button onclick="openFacebook()">
    Open Facebook
  </button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function openFacebook() {
      tg.openLink("https://www.facebook.com/");
    }
  </script>
</body>
</html>
