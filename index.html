
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dummy Credential Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #172033;
      padding: 24px 16px;
    }
    main {
      max-width: 380px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
    }
    button {
      background: #0866ff;
      color: white;
      border: 0;
      border-radius: 8px;
    }
    #result { display: none; }
  </style>
</head>
<body>
  <main>
    <h2>Dummy Credential Test</h2>
    <p>Practice with fictional details only. Never enter a real password.</p>

    <form id="demoForm">
      <label for="demoUser">Test username</label>
      <input id="demoUser" autocomplete="off" required>

      <label for="demoPass">Test password</label>
      <input id="demoPass" type="password" autocomplete="off" required>

      <button type="submit">Run test</button>
    </form>

    <section id="result" aria-live="polite">
      <h3 id="message"></h3>
      <p>This was a local simulation. No credentials were transmitted or saved.</p>
      <button id="retry" type="button">Try again</button>
    </section>
  </main>

  <script>
    const form = document.getElementById("demoForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const username = document.getElementById("demoUser").value;
      const password = document.getElementById("demoPass").value;

      const match =
        username === "tester@example.test" &&
        password === "DemoPassword123!";

      document.getElementById("message").textContent = match
        ? "Dummy test passed!"
        : "Dummy details did not match. Try the fictional test values.";

      form.style.display = "none";
      result.style.display = "block";
    });

    document.getElementById("retry").addEventListener("click", function () {
      form.reset();
      result.style.display = "none";
      form.style.display = "block";
    });
  </script>
</body>
</html>
